name: Pack and Publish NuGet

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated packages to NuGet from the macOS runner.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lidguard-pack-and-publish
  cancel-in-progress: false

jobs:
  preflight-windows:
    if: ${{ github.actor == 'airtaxi' }}
    name: Preflight Windows Runner
    runs-on: [self-hosted, Windows, X64, lidguard, windows-host]
    steps:
      - name: Check runner
        shell: pwsh
        run: |
          "runner.os=$env:RUNNER_OS"
          "runner.arch=$env:RUNNER_ARCH"
          "runner.name=$env:RUNNER_NAME"
          hostname

  preflight-linux:
    if: ${{ github.actor == 'airtaxi' }}
    name: Preflight Linux Runner
    runs-on: [self-hosted, Linux, X64, lidguard, linux-x64]
    steps:
      - name: Check runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner.os=$RUNNER_OS"
          echo "runner.arch=$RUNNER_ARCH"
          echo "runner.name=$RUNNER_NAME"
          hostname

  preflight-macos:
    if: ${{ github.actor == 'airtaxi' }}
    name: Preflight macOS Runner
    runs-on: [self-hosted, macOS, ARM64, lidguard, macos-arm64]
    steps:
      - name: Check runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner.os=$RUNNER_OS"
          echo "runner.arch=$RUNNER_ARCH"
          echo "runner.name=$RUNNER_NAME"
          hostname

  pack-windows:
    if: ${{ github.actor == 'airtaxi' }}
    name: Pack Windows Tool Packages
    needs: [preflight-windows, preflight-linux, preflight-macos]
    runs-on: [self-hosted, Windows, X64, lidguard, windows-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Pack Windows RIDs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$project = Get-Content -LiteralPath "LidGuard/LidGuard.csproj" -Raw
          $version = ($project.Project.PropertyGroup | Where-Object { $_.VersionPrefix } | Select-Object -First 1).VersionPrefix
          if ([string]::IsNullOrWhiteSpace($version)) { throw "VersionPrefix was not found." }

          Remove-Item -LiteralPath "artifacts" -Recurse -Force -ErrorAction SilentlyContinue
          $packRootDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/pack"
          $packagesDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/packages"
          New-Item -ItemType Directory -Path $packRootDirectory, $packagesDirectory -Force | Out-Null

          $runtimeIdentifiers = @("win-x64", "win-x86", "win-arm64")
          foreach ($runtimeIdentifier in $runtimeIdentifiers) {
            $runtimePackDirectory = Join-Path $packRootDirectory $runtimeIdentifier
            $runtimeProjectDirectory = Join-Path $runtimePackDirectory "LidGuard"
            New-Item -ItemType Directory -Path $runtimePackDirectory -Force | Out-Null
            Copy-Item -LiteralPath "LidGuard" -Destination $runtimeProjectDirectory -Recurse -Force
          }

          $packJobs = foreach ($runtimeIdentifier in $runtimeIdentifiers) {
            $runtimeProjectPath = Join-Path $packRootDirectory "$runtimeIdentifier/LidGuard/LidGuard.csproj"
            $runtimePlatform = $runtimeIdentifier -replace "^win-", "windows-"
            Start-Job -Name "pack-$runtimeIdentifier" -ArgumentList $runtimeIdentifier, $runtimePlatform, $runtimeProjectPath, $packagesDirectory -ScriptBlock {
              param($runtimeIdentifier, $runtimePlatform, $runtimeProjectPath, $packagesDirectory)
              $ErrorActionPreference = "Stop"
              & dotnet pack $runtimeProjectPath -c Release "-p:Platform=$runtimePlatform" /p:ContinuousIntegrationBuild=true "/p:PackageOutputPath=$packagesDirectory"
              if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed for $runtimeIdentifier." }
            }
          }

          $packJobs | Wait-Job | Out-Null
          $failedRuntimeIdentifiers = @()
          foreach ($packJob in $packJobs) {
            Receive-Job -Job $packJob -ErrorAction Continue
            if ($packJob.State -ne "Completed") {
              $failedRuntimeIdentifiers += $packJob.Name.Replace("pack-", "")
            }
          }

          $packJobs | Remove-Job
          if ($failedRuntimeIdentifiers.Count -gt 0) {
            throw "dotnet pack failed for: $($failedRuntimeIdentifiers -join ', ')"
          }

          foreach ($runtimeIdentifier in $runtimeIdentifiers) {
            $packagePath = "artifacts/packages/lidguard.$runtimeIdentifier.$version.nupkg"
            if (-not (Test-Path -LiteralPath $packagePath)) { throw "Missing expected package: $packagePath" }
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: lidguard-packages-windows
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  pack-linux:
    if: ${{ github.actor == 'airtaxi' }}
    name: Pack Linux Tool Packages
    needs: [preflight-windows, preflight-linux, preflight-macos]
    runs-on: [self-hosted, Linux, X64, lidguard, linux-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Pack Linux RIDs
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' LidGuard/LidGuard.csproj | head -n 1)"
          if [ -z "$version" ]; then
            echo "VersionPrefix was not found." >&2
            exit 1
          fi

          rm -rf artifacts
          pack_root_directory="$GITHUB_WORKSPACE/artifacts/pack"
          packages_directory="$GITHUB_WORKSPACE/artifacts/packages"
          logs_directory="$GITHUB_WORKSPACE/artifacts/logs"
          mkdir -p "$pack_root_directory" "$packages_directory" "$logs_directory"

          runtime_identifiers="linux-x64"
          for runtime_identifier in $runtime_identifiers; do
            runtime_pack_directory="$pack_root_directory/$runtime_identifier"
            runtime_project_directory="$runtime_pack_directory/LidGuard"
            mkdir -p "$runtime_pack_directory"
            cp -R LidGuard "$runtime_project_directory"
          done

          pack_process_ids=""
          for runtime_identifier in $runtime_identifiers; do
            runtime_project_path="$pack_root_directory/$runtime_identifier/LidGuard/LidGuard.csproj"
            log_path="$logs_directory/pack-$runtime_identifier.log"
            (
              set -euo pipefail
              dotnet pack "$runtime_project_path" -c Release -p:Platform="$runtime_identifier" /p:ContinuousIntegrationBuild=true "/p:PackageOutputPath=$packages_directory"
            ) > "$log_path" 2>&1 &
            pack_process_ids="$pack_process_ids $runtime_identifier:$!"
          done

          failed_runtime_identifiers=""
          for pack_process_id in $pack_process_ids; do
            runtime_identifier="${pack_process_id%%:*}"
            process_id="${pack_process_id##*:}"
            log_path="$logs_directory/pack-$runtime_identifier.log"
            if wait "$process_id"; then
              cat "$log_path"
            else
              cat "$log_path"
              failed_runtime_identifiers="$failed_runtime_identifiers $runtime_identifier"
            fi
          done

          if [ -n "$failed_runtime_identifiers" ]; then
            echo "dotnet pack failed for:$failed_runtime_identifiers" >&2
            exit 1
          fi

          for runtime_identifier in $runtime_identifiers; do
            package_path="artifacts/packages/lidguard.$runtime_identifier.$version.nupkg"
            if [ ! -f "$package_path" ]; then
              echo "Missing expected package: $package_path" >&2
              exit 1
            fi
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: lidguard-packages-linux
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  pack-macos:
    if: ${{ github.actor == 'airtaxi' }}
    name: Pack macOS Tool Packages
    needs: [preflight-windows, preflight-linux, preflight-macos]
    runs-on: [self-hosted, macOS, ARM64, lidguard, macos-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Pack macOS RIDs and root tool package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' LidGuard/LidGuard.csproj | head -n 1)"
          if [ -z "$version" ]; then
            echo "VersionPrefix was not found." >&2
            exit 1
          fi

          rm -rf artifacts
          pack_root_directory="$GITHUB_WORKSPACE/artifacts/pack"
          packages_directory="$GITHUB_WORKSPACE/artifacts/packages"
          logs_directory="$GITHUB_WORKSPACE/artifacts/logs"
          mkdir -p "$pack_root_directory" "$packages_directory" "$logs_directory"

          runtime_identifiers="osx-x64 osx-arm64"
          for runtime_identifier in $runtime_identifiers; do
            runtime_pack_directory="$pack_root_directory/$runtime_identifier"
            runtime_project_directory="$runtime_pack_directory/LidGuard"
            mkdir -p "$runtime_pack_directory"
            cp -R LidGuard "$runtime_project_directory"
          done

          pack_process_ids=""
          log_path="$logs_directory/pack-root.log"
          (
            set -euo pipefail
            dotnet pack LidGuard/LidGuard.csproj -c Release /p:ContinuousIntegrationBuild=true "/p:PackageOutputPath=$packages_directory"
          ) > "$log_path" 2>&1 &
          pack_process_ids="$pack_process_ids root:$!"

          for runtime_identifier in $runtime_identifiers; do
            runtime_project_path="$pack_root_directory/$runtime_identifier/LidGuard/LidGuard.csproj"
            log_path="$logs_directory/pack-$runtime_identifier.log"
            runtime_platform="macos-${runtime_identifier#osx-}"
            (
              set -euo pipefail
              dotnet pack "$runtime_project_path" -c Release -p:Platform="$runtime_platform" /p:ContinuousIntegrationBuild=true "/p:PackageOutputPath=$packages_directory"
            ) > "$log_path" 2>&1 &
            pack_process_ids="$pack_process_ids $runtime_identifier:$!"
          done

          failed_runtime_identifiers=""
          for pack_process_id in $pack_process_ids; do
            runtime_identifier="${pack_process_id%%:*}"
            process_id="${pack_process_id##*:}"
            log_path="$logs_directory/pack-$runtime_identifier.log"
            if wait "$process_id"; then
              cat "$log_path"
            else
              cat "$log_path"
              failed_runtime_identifiers="$failed_runtime_identifiers $runtime_identifier"
            fi
          done

          if [ -n "$failed_runtime_identifiers" ]; then
            echo "dotnet pack failed for:$failed_runtime_identifiers" >&2
            exit 1
          fi

          package_path="artifacts/packages/lidguard.$version.nupkg"
          if [ ! -f "$package_path" ]; then
            echo "Missing expected package: $package_path" >&2
            exit 1
          fi

          for runtime_identifier in $runtime_identifiers; do
            package_path="artifacts/packages/lidguard.$runtime_identifier.$version.nupkg"
            if [ ! -f "$package_path" ]; then
              echo "Missing expected package: $package_path" >&2
              exit 1
            fi
          done

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: lidguard-packages-macos
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish-nuget:
    if: ${{ github.actor == 'airtaxi' && inputs.publish }}
    name: Publish NuGet Packages
    needs: [pack-windows, pack-linux, pack-macos]
    runs-on: [self-hosted, macOS, ARM64, lidguard, macos-arm64]
    environment:
      name: nuget-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: lidguard-packages-*
          path: artifacts/packages
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Publish packages to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY secret is not configured." >&2
            exit 1
          fi

          version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' LidGuard/LidGuard.csproj | head -n 1)"
          if [ -z "$version" ]; then
            echo "VersionPrefix was not found." >&2
            exit 1
          fi

          packages="
          artifacts/packages/lidguard.win-x64.$version.nupkg
          artifacts/packages/lidguard.win-x86.$version.nupkg
          artifacts/packages/lidguard.win-arm64.$version.nupkg
          artifacts/packages/lidguard.linux-x64.$version.nupkg
          artifacts/packages/lidguard.osx-x64.$version.nupkg
          artifacts/packages/lidguard.osx-arm64.$version.nupkg
          artifacts/packages/lidguard.$version.nupkg
          "

          for package in $packages; do
            if [ ! -f "$package" ]; then
              echo "Missing expected package: $package" >&2
              exit 1
            fi
          done

          for package in $packages; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done
